services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: loan-api:prod
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://loan:devpassword@db:5432/loans
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loan
      POSTGRES_PASSWORD: devpassword   # development-only password (the one allowed exception)
      POSTGRES_DB: loans
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loan -d loans"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
